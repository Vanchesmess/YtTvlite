<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opaline Web</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff;--fg:#111;--mut:#667;--card:#f1f1f5;--acc:#6c5ce7}
:root[data-t=dark]{--bg:#0f0f14;--fg:#f2f2f5;--mut:#9a9aab;--card:#1c1c26}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;display:flex;gap:8px}
#q{flex:1;padding:9px 12px;border-radius:20px;border:0;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:12px}
.card{position:relative;display:block}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--card)}
.card b{display:block;margin-top:6px;font-weight:600}.card small,.mut{color:var(--mut)}
.dur{position:absolute;right:6px;top:calc(56.25% * 1 - 24px);background:#000c;color:#fff;font-size:12px;padding:1px 5px;border-radius:4px}
.more{position:absolute;right:0;bottom:0;background:none;border:0;font-size:20px;padding:4px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 0;color:var(--mut)}nav a.on{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;overflow:auto;padding:4px 12px}
.chip{background:var(--card);border:0;border-radius:16px;padding:6px 12px;white-space:nowrap}.chip.on{background:var(--acc);color:#fff}
.pad{padding:12px}.pl{position:sticky;top:44px;z-index:4;background:#000;aspect-ratio:16/9;width:100%}.pl iframe{width:100%;height:100%}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--card);gap:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:18px;padding:8px 14px}.btn.g{background:var(--card);color:var(--fg)}
.acts{display:flex;gap:8px;overflow:auto;padding:8px 0}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sheet div{background:var(--bg);width:100%;padding:8px 0 calc(12px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
#sheet button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 20px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:16px;display:none;z-index:10}
h3{margin:12px}.cm{padding:8px 12px}.cm b{font-size:13px}
</style></head><body>
<header><input id="q" type="search" enterkeydown placeholder="Search"></header>
<main id="m"></main><nav id="nav"></nav>
<div id="sheet" onclick="this.style.display='none'"><div id="sh"></div></div><div id="toast"></div>
<script src="app.js"></script>
</body></html>
